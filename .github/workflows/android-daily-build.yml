name: Android daily build

on:
  schedule:
    - cron: "21 3 * * *" # 03:21 UTC daily
  workflow_dispatch: {}

concurrency:
  group: android-daily-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Sync fork with upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh repo sync "${{ github.repository }}" --source pingdotgg/t3code --branch main
          echo "synced=$(date -u +%Y-%m-%dT%H:%MZ)" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout synced main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Record synced commit
        id: meta
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # node 24 + pnpm 11 from package.json, filtered to the mobile workspace.
      # setup-vp caches the pnpm store: cold ~4-5min, warm ~30-60s.
      - name: Setup Vite+ (node + pnpm, cached)
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...

      - name: Expose pnpm binary
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          vp_pnpm_bin="$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin"
          echo "$vp_pnpm_bin" >> "$GITHUB_PATH"
          "$vp_pnpm_bin/pnpm" --version

      - name: Repo env (public identifiers only, no secrets needed)
        run: cp .env.example .env

      - name: Expo prebuild (generate native android/)
        working-directory: apps/mobile
        env:
          APP_VARIANT: production
          NODE_OPTIONS: --max-old-space-size=8192
        run: npx expo prebuild --platform android --clean --no-install

      # Gradle wrapper + deps + kotlin transforms cached across runs.
      # Cold gradle ~25-30min on 4-core; warm cache cuts it to ~10-15min.
      - name: Cache gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/android/gradle/wrapper/gradle-wrapper.properties', 'pnpm-lock.yaml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Build unsigned release APK (arm64 + armv7 + x86_64)
        working-directory: apps/mobile/android
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64 \
            --no-daemon

      # Sign with our own keystore via apksigner (build-tools), independent of
      # gradle config: same key every build = installs over previous builds.
      - name: Sign APK
        id: sign
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          APK=$(ls apps/mobile/android/app/build/outputs/apk/release/*.apk | head -1)
          BT="$ANDROID_HOME/build-tools"
          APKSIGNER=$(ls -d "$BT"/*/apksigner | sort -V | tail -1)
          ZIPALIGN=$(ls -d "$BT"/*/zipalign | sort -V | tail -1)

          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            "$ZIPALIGN" -f 4 "$APK" "$RUNNER_TEMP/aligned.apk"
            "$APKSIGNER" sign \
              --ks "$RUNNER_TEMP/release.keystore" \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "env:KS_PASS" \
              --out "$RUNNER_TEMP/signed.apk" \
              "$RUNNER_TEMP/aligned.apk"
            "$APKSIGNER" verify "$RUNNER_TEMP/signed.apk"
            OUT="$RUNNER_TEMP/signed.apk"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            OUT="$APK"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::no ANDROID_KEYSTORE_B64 secret; shipping UNSIGNED apk (won't install without adb)!"
          fi
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Name + upload artifact
        env:
          SIGNED: ${{ steps.sign.outputs.signed }}
        run: |
          NAME="t3code-android-$(date -u +%Y%m%d)-${{ steps.meta.outputs.sha }}"
          mkdir -p dist
          cp "${{ steps.sign.outputs.path }}" "dist/${NAME}.apk"
          {
            echo "### t3code android build"
            echo "- upstream main @ ${{ steps.meta.outputs.sha }}"
            echo "- signed: $SIGNED"
            echo "- built: $(date -u)"
          } > dist/NOTES.md
          echo "artifact_name=${NAME}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_name }}
          path: dist/*
          retention-days: 30
          if-no-files-found: error

      - name: Publish rolling release (android-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-latest"
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" "dist/${{ env.artifact_name }}.apk" \
            --title "t3code android ${{ steps.meta.outputs.sha }}" \
            --notes "Automated build of upstream main @ ${{ steps.meta.outputs.sha }} (${{ steps.sign.outputs.signed }} signing)."
